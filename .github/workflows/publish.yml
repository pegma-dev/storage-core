# Publication uses selected source and authenticated original registry archives.
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
env:
  CI: "1"
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
  REVIEWED_NPM_VERSION: "11.18.0"

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish packages"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the supported stable format"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release commit must be a full commit SHA"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi
          verify_directory="$(mktemp -d "${RUNNER_TEMP}/release-tag.XXXXXX")"
          trap 'rm -rf "${verify_directory}"' EXIT
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git init --bare "${verify_directory}"
          git -C "${verify_directory}" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "${verify_directory}" config gpg.format ssh
          git -C "${verify_directory}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${verify_directory}" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${verify_directory}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${verify_directory}" verify-tag "refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${verify_directory}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_COMMIT}" ]]
          git -C "${verify_directory}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

  validate:
    needs: identity
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Set up Java for DynamoDB Local
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Check types
        run: pnpm run check
      - name: Run tests
        run: pnpm test
      - name: Check release metadata
        run: pnpm run release:check

  prepare:
    needs: [identity, validate]
    runs-on: ubuntu-latest
    outputs:
      manifest-digest: ${{ steps.seal.outputs.manifest_digest }}
      policy-digest: ${{ steps.seal.outputs.policy_digest }}
      policy-base64: ${{ steps.seal.outputs.policy_base64 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Configure checkout tag verification
        shell: bash
        run: |
          set -euo pipefail
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Check the npm version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(npm --version)" == "${REVIEWED_NPM_VERSION}" ]]
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack the release files
        run: >-
          pnpm run release:pack -- --require-clean --require-main-ancestor
          --require-release-tag --skip-smoke
          --expected-release-commit "${RELEASE_COMMIT}"
          --output "${RUNNER_TEMP}/storage-prepared"
      - name: Seal the release inventory
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          manifest_digest="$(sha256sum "${RUNNER_TEMP}/storage-prepared/package-manifest.json" | cut -d' ' -f1)"
          policy_digest="$(sha256sum scripts/release-reuse-policy.json | cut -d' ' -f1)"
          policy_base64="$(base64 -w0 scripts/release-reuse-policy.json)"
          printf 'manifest_digest=%s\npolicy_digest=%s\npolicy_base64=%s\n' \
            "${manifest_digest}" "${policy_digest}" "${policy_base64}" >> "${GITHUB_OUTPUT}"
      - name: Upload the prepared release
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: storage-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-prepared/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
      - name: Retain genuine registry reuse proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: storage-reuse-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-prepared-reuse-verification/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
      - name: Record original artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          MANIFEST_DIGEST: ${{ steps.seal.outputs.manifest_digest }}
        run: printf 'Original artifact %s ZIP SHA256 %s manifest SHA256 %s\n' "${ARTIFACT_ID}" "${ARTIFACT_DIGEST}" "${MANIFEST_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
      RELEASE_DIRECTORY: ${{ runner.temp }}/storage-smoke
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Set up Java for DynamoDB Local
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the prepared release copy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/storage-smoke
          merge-multiple: true
      - name: Smoke-test the prepared release copy
        run: >-
          node scripts/release-packages.mjs smoke
          --manifest "${RELEASE_DIRECTORY}/package-manifest.json"
          --expected-release-commit "${RELEASE_COMMIT}"
          --expected-manifest-sha256 "${EXPECTED_MANIFEST_DIGEST}"
          --output "${RUNNER_TEMP}/storage-consumer-proof"
      - name: Retain public consumer proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: storage-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-consumer-proof/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

  preflight:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      preflight-digest: ${{ steps.seal.outputs.preflight_digest }}
    env:
      EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
      RELEASE_DIRECTORY: ${{ runner.temp }}/storage-preflight-input
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Download the original prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/storage-preflight-input
          merge-multiple: true
      - name: Verify registry preflight
        run: >-
          node scripts/release-registry-verify.mjs preflight
          --manifest "${RELEASE_DIRECTORY}/package-manifest.json"
          --expected-release-commit "${RELEASE_COMMIT}"
          --expected-manifest-sha256 "${EXPECTED_MANIFEST_DIGEST}"
          --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --output "${RUNNER_TEMP}/storage-preflight-proof"
      - name: Seal registry preflight
        id: seal
        run: printf 'preflight_digest=%s\n' "$(sha256sum "${RUNNER_TEMP}/storage-preflight-proof/preflight.json" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      - name: Retain registry preflight
        if: always()
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: storage-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-preflight-proof/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30

  publish:
    needs: [prepare, smoke, preflight]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
      EXPECTED_POLICY_DIGEST: ${{ needs.prepare.outputs.policy-digest }}
      REGISTRY_POLICY_BASE64: ${{ needs.prepare.outputs.policy-base64 }}
      EXPECTED_PREFLIGHT_DIGEST: ${{ needs.preflight.outputs.preflight-digest }}
      RELEASE_DIRECTORY: ${{ runner.temp }}/storage-publish
      PREFLIGHT_DIRECTORY: ${{ runner.temp }}/storage-publish-preflight
    steps:
      - name: Verify the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish packages"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the supported stable format"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release commit must be a full commit SHA"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi
          verify_directory="$(mktemp -d "${RUNNER_TEMP}/release-tag.XXXXXX")"
          trap 'rm -rf "${verify_directory}"' EXIT
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git init --bare "${verify_directory}"
          git -C "${verify_directory}" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "${verify_directory}" config gpg.format ssh
          git -C "${verify_directory}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${verify_directory}" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${verify_directory}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${verify_directory}" verify-tag "refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${verify_directory}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "${RELEASE_COMMIT}" ]]
          git -C "${verify_directory}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Check the npm version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(npm --version)" == "${REVIEWED_NPM_VERSION}" ]]
      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/storage-publish
          merge-multiple: true
      - name: Download sealed registry preflight
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.preflight.outputs.artifact-id }}
          path: ${{ runner.temp }}/storage-publish-preflight
          merge-multiple: true
      - name: Verify and publish the prepared release
        shell: bash
        run: |
          set -euo pipefail
          publisher="$(mktemp "${RUNNER_TEMP}/publish-release.XXXXXX.mjs")"
          trap 'rm -f "${publisher}"' EXIT
          cat > "${publisher}" <<'NODE'
          import { spawnSync } from "node:child_process";
          import { createHash, timingSafeEqual } from "node:crypto";
          import { constants } from "node:fs";
          import { chmod, copyFile, lstat, mkdtemp, open, readFile, readdir, realpath, rm, writeFile } from "node:fs/promises";
          import { basename, dirname, join, resolve } from "node:path";
          import { tmpdir } from "node:os";
          const repository="pegma-dev/storage-core", registry="https://registry.npmjs.org/";
          const workflow=".github/workflows/publish.yml";
          const definitions=[
            ["@pegma/storage-core","storage-core"],
            ["@pegma/storage-azure-tables","storage-azure-tables"],
            ["@pegma/storage-cloudflare-d1","storage-cloudflare-d1"],
            ["@pegma/storage-dynamodb","storage-dynamodb"],
          ];
          function fail(message){throw new Error(message);}
          function equal(a,b){if(typeof a!=="string"||typeof b!=="string")return false;const x=Buffer.from(a),y=Buffer.from(b);return x.length===y.length&&timingSafeEqual(x,y);}
          function digest(bytes,algorithm="sha256",encoding="hex"){return createHash(algorithm).update(bytes).digest(encoding);}
          function exact(value,keys){if(!value||typeof value!=="object"||Array.isArray(value)||JSON.stringify(Object.keys(value).sort())!==JSON.stringify([...keys].sort()))fail("release data has invalid fields");}
          function integer(value){if(!Number.isSafeInteger(value)||value<1)fail("release identity has an invalid integer");}
          function originFor(entry){return {kind:"registryReuse",registry,policyEntry:entry.name+"@"+entry.version,tarballUrl:entry.tarballUrl,
            sourceCommit:entry.sourceCommit,sourceTag:entry.sourceTag,workflowPath:entry.workflowPath,
            originalRunId:entry.originalRunId,originalRunAttempt:entry.originalRunAttempt};}
          function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
          async function boundedFile(path,maximum){
            const metadata=await lstat(path);
            if(!metadata.isFile()||metadata.isSymbolicLink()||metadata.size<1||metadata.size>maximum||await realpath(path)!==resolve(path))fail("prepared file is invalid");
            const handle=await open(path,constants.O_RDONLY|(constants.O_NOFOLLOW??0));
            try{
              const opened=await handle.stat();
              if(opened.dev!==metadata.dev||opened.ino!==metadata.ino||opened.size!==metadata.size)fail("prepared file changed");
              const bytes=Buffer.alloc(metadata.size+1);let length=0;
              while(length<bytes.length){const result=await handle.read(bytes,length,bytes.length-length,length);if(!result.bytesRead)break;length+=result.bytesRead;}
              if(length!==metadata.size)fail("prepared file changed");return bytes.subarray(0,length);
            }finally{await handle.close();}
          }
          let oidc;
          try{oidc=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);}catch{fail("approved OIDC environment is required");}
          if(process.env.GITHUB_ACTIONS!=="true"||process.env.GITHUB_EVENT_NAME!=="release"||
            process.env.GITHUB_REPOSITORY!==repository||process.env.GITHUB_SERVER_URL!=="https://github.com"||
            process.env.GITHUB_REPOSITORY_ID!=="1312519623"||process.env.GITHUB_REPOSITORY_OWNER_ID!=="309286193"||
            process.env.GITHUB_REF!=="refs/tags/"+process.env.RELEASE_TAG||
            process.env.GITHUB_SHA!==process.env.RELEASE_COMMIT||process.env.GITHUB_WORKFLOW_SHA!==process.env.RELEASE_COMMIT||
            process.env.GITHUB_WORKFLOW_REF!==repository+"/"+workflow+"@refs/tags/"+process.env.RELEASE_TAG||
            process.env.RUNNER_ENVIRONMENT!=="github-hosted"||oidc.protocol!=="https:"||oidc.username||oidc.password||
            !/^(?:[A-Za-z0-9-]+\.)*actions\.githubusercontent\.com$/u.test(oidc.hostname)||
            !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN||
            Object.entries(process.env).some(([key,value])=>value&&/^(?:NODE_AUTH_TOKEN|NPM_TOKEN|NPM_AUTH_TOKEN|NPM_AUTH|YARN_NPM_AUTH_TOKEN|npm_config_.*)$/iu.test(key)))
            fail("token-free github-hosted release OIDC is required");
          const runId=Number(process.env.GITHUB_RUN_ID),runAttempt=Number(process.env.GITHUB_RUN_ATTEMPT);integer(runId);integer(runAttempt);
          const releaseDirectory=resolve(process.env.RELEASE_DIRECTORY);
          const manifestBytes=await boundedFile(join(releaseDirectory,"package-manifest.json"),1024*1024);
          if(!/^[a-f0-9]{64}$/u.test(process.env.EXPECTED_MANIFEST_DIGEST??"")||
            !equal(digest(manifestBytes),process.env.EXPECTED_MANIFEST_DIGEST))fail("independent manifest digest differs");
          const manifest=JSON.parse(manifestBytes);
          exact(manifest,["schemaVersion","repository","gitCommit","releaseTag","registryPolicySha256","packages"]);
          if(manifest.schemaVersion!==2||manifest.repository!==repository||manifest.gitCommit!==process.env.RELEASE_COMMIT||
            manifest.releaseTag!==process.env.RELEASE_TAG||!/^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$/u.test(manifest.releaseTag)||
            !Array.isArray(manifest.packages)||manifest.packages.length!==4)fail("prepared release identity differs");
          const policyBytes=Buffer.from(process.env.REGISTRY_POLICY_BASE64??"","base64");
          if(policyBytes.length>32768||!equal(digest(policyBytes),process.env.EXPECTED_POLICY_DIGEST)||
            !equal(digest(policyBytes),manifest.registryPolicySha256))fail("independent registry policy differs");
          const policy=JSON.parse(policyBytes);
          exact(policy,["schemaVersion","repository","repositoryId","ownerId","builder","packages"]);
          if(policy.schemaVersion!==1||policy.repository!==repository||policy.repositoryId!=="1312519623"||
            policy.ownerId!=="309286193"||policy.builder!=="https://github.com/actions/runner/github-hosted"||
            !Array.isArray(policy.packages)||policy.packages.length>definitions.length)fail("registry policy identity differs");
          let previousPolicyIndex=-1;
          for(const entry of policy.packages){
            exact(entry,["name","version","directory","tarballUrl","size","sha256","integrity","shasum",
              "sourceCommit","sourceTag","workflowPath","originalRunId","originalRunAttempt"]);
            const index=definitions.findIndex(([name])=>name===entry.name);
            if(index<=previousPolicyIndex||entry.directory!==definitions[index]?.[1]||
              !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.test(entry.version)||
              entry.tarballUrl!==registry+entry.name+"/-/"+entry.directory+"-"+entry.version+".tgz"||
              !/^[a-f0-9]{64}$/u.test(entry.sha256)||!/^[a-f0-9]{40}$/u.test(entry.shasum)||
              !/^sha512-[A-Za-z0-9+/]{86}==$/u.test(entry.integrity)||
              !/^[a-f0-9]{40}$/u.test(entry.sourceCommit)||entry.sourceTag!=="v"+entry.version||
              entry.workflowPath!==workflow)fail("registry policy entry differs");
            integer(entry.size);integer(entry.originalRunId);integer(entry.originalRunAttempt);
            if(entry.size>4*1024*1024)fail("registry policy archive is too large");
            previousPolicyIndex=index;
          }
          if(manifest.packages.some(record=>!record?.publish&&!policy.packages.some(entry=>
            entry.name===record?.name&&entry.version===record?.version)))fail("unselected package policy is missing");
          const expectedFiles=["package-manifest.json",...manifest.packages.map(record=>record.tarball)].sort();
          const entries=await readdir(releaseDirectory,{withFileTypes:true});
          if(!same(entries.map(entry=>entry.name).sort(),expectedFiles)||entries.some(entry=>!entry.isFile()||entry.name.startsWith(".")))fail("original five-file inventory differs");
          const versions=new Map(manifest.packages.map(record=>[record.name,record.version]));
          let selected=0;
          for(const [index,record] of manifest.packages.entries()){
            exact(record,["name","version","directory","tarball","size","shasum","sha256","integrity","publish","files","package","origin"]);
            const [name,directory]=definitions[index];
            if(record.name!==name||record.directory!==directory||! /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.test(record.version)||
              record.tarball!==name.slice(1).replace("/","-")+"-"+record.version+".tgz"||basename(record.tarball)!==record.tarball||
              !Number.isSafeInteger(record.size)||record.size<1||record.size>4*1024*1024||
              !/^[a-f0-9]{64}$/u.test(record.sha256)||!/^[a-f0-9]{40}$/u.test(record.shasum)||
              !/^sha512-[A-Za-z0-9+/]{86}==$/u.test(record.integrity)||typeof record.publish!=="boolean"||
              record.package?.name!==name||record.package.version!==record.version||record.package.license!=="MIT"||
              record.package.type!=="module"||record.package.publishConfig?.access!=="public"||
              record.package.repository?.url!=="git+https://github.com/"+repository+".git"||
              record.package.repository?.directory!=="packages/"+directory)fail("prepared package metadata differs");
            if(record.publish){
              selected++;
              if(!same(record.origin,{kind:"source",repository,gitCommit:manifest.gitCommit,releaseTag:manifest.releaseTag,directory})||
                record.version!==manifest.releaseTag.slice(1))fail("source origin differs");
            }else{
              const entry=policy.packages.find(entry=>entry.name===name&&entry.version===record.version);
              if(!entry||!same(record.origin,originFor(entry))||record.version===manifest.releaseTag.slice(1)||
                record.size!==entry.size||!equal(record.sha256,entry.sha256)||!equal(record.integrity,entry.integrity)||
                !equal(record.shasum,entry.shasum))fail("original registry origin differs");
            }
            for(const section of ["dependencies","devDependencies","optionalDependencies","peerDependencies"])
              for(const [dependency,version] of Object.entries(record.package[section]??{}))
                if(versions.has(dependency)&&version!==versions.get(dependency))fail("internal dependency pin differs");
            const bytes=await boundedFile(join(releaseDirectory,record.tarball),4*1024*1024);
            if(bytes.length!==record.size||!equal(digest(bytes),record.sha256)||!equal(digest(bytes,"sha1"),record.shasum)||
              !equal("sha512-"+digest(bytes,"sha512","base64"),record.integrity))fail("original artifact bytes differ");
          }
          if(!selected)fail("release has no source packages");
          const preflightDirectory=resolve(process.env.PREFLIGHT_DIRECTORY);
          const preflightBytes=await boundedFile(join(preflightDirectory,"preflight.json"),4*1024*1024);
          if(!/^[a-f0-9]{64}$/u.test(process.env.EXPECTED_PREFLIGHT_DIGEST??"")||
            !equal(digest(preflightBytes),process.env.EXPECTED_PREFLIGHT_DIGEST))fail("independent preflight digest differs");
          const preflight=JSON.parse(preflightBytes);
          exact(preflight,["schemaVersion","repository","gitCommit","releaseTag","manifestSha256","runId","runAttempt","decisions","registryProof"]);
          if(preflight.schemaVersion!==1||preflight.repository!==repository||preflight.gitCommit!==manifest.gitCommit||
            preflight.releaseTag!==manifest.releaseTag||preflight.manifestSha256!==process.env.EXPECTED_MANIFEST_DIGEST||
            preflight.runId!==runId||!Number.isSafeInteger(preflight.runAttempt)||preflight.runAttempt<1||preflight.runAttempt>runAttempt||
            !Array.isArray(preflight.decisions)||preflight.decisions.length!==4||
            preflight.registryProof?.status!=="REGISTRY_BYTES_CRYPTO_SOURCE_PASS"||
            preflight.registryProof.npmVersion!=="11.18.0"||preflight.registryProof.policySha256!==manifest.registryPolicySha256||
            !equal(preflight.registryProof.auditSha256,digest(await boundedFile(join(preflightDirectory,"npm-audit-signatures.json"),32*1024*1024))))
            fail("authenticated whole-set preflight binding differs");
          for(const [index,record] of manifest.packages.entries()){
            const decision=preflight.decisions[index];exact(decision,["name","version","action"]);
            if(decision.name!==record.name||decision.version!==record.version||!["skip","publish"].includes(decision.action)||
              !record.publish&&decision.action!=="skip")fail("preflight decision differs");
            if(decision.action==="skip"){
              const facts=preflight.registryProof.packages?.filter(fact=>fact.name===record.name&&fact.version===record.version);
              if(facts?.length!==1)fail("preflight authenticated package fact is missing");
              const fact=facts[0], origin=record.origin;
              if(fact.sourceCommit!==(record.publish?manifest.gitCommit:origin.sourceCommit)||
                fact.sourceTag!==(record.publish?manifest.releaseTag:origin.sourceTag)||
                fact.runId!==(record.publish?runId:origin.originalRunId)||
                !Number.isSafeInteger(fact.attempt)||fact.attempt<1||
                (record.publish?fact.attempt>runAttempt:fact.attempt!==origin.originalRunAttempt))
                fail("preflight authenticated original writer differs");
            }
          }
          const configDirectory=await mkdtemp(join(process.env.RUNNER_TEMP??tmpdir(),"npm-config-"));
          await chmod(configDirectory,0o700);
          const userConfig=join(configDirectory,"userconfig"),globalConfig=join(configDirectory,"globalconfig");
          await writeFile(userConfig,"",{mode:0o600});await writeFile(globalConfig,"",{mode:0o600});
          function npmEnvironment(){
            const selectedEnvironment={};
            const exact=new Set(["PATH","HOME","CI","SYSTEMROOT","TEMP","TMP","TMPDIR","RUNNER_TEMP","RUNNER_TOOL_CACHE",
              "GITHUB_ACTIONS","GITHUB_EVENT_NAME","GITHUB_REPOSITORY","GITHUB_REPOSITORY_ID","GITHUB_REPOSITORY_OWNER_ID",
              "GITHUB_SERVER_URL","GITHUB_REF","GITHUB_SHA","GITHUB_WORKFLOW_REF","GITHUB_WORKFLOW_SHA","GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT","RUNNER_ENVIRONMENT","ACTIONS_ID_TOKEN_REQUEST_URL","ACTIONS_ID_TOKEN_REQUEST_TOKEN"]);
            for(const [key,value] of Object.entries(process.env))if(exact.has(key.toUpperCase()))selectedEnvironment[key]=value;
            selectedEnvironment.NPM_CONFIG_USERCONFIG=userConfig;selectedEnvironment.NPM_CONFIG_GLOBALCONFIG=globalConfig;
            selectedEnvironment.NPM_CONFIG_IGNORE_SCRIPTS="true";selectedEnvironment.NPM_CONFIG_REGISTRY=registry;
            return selectedEnvironment;
          }
          function npm(args,cwd,inherit=false){
            const result=spawnSync("npm",args,{cwd,encoding:"utf8",env:npmEnvironment(),shell:false,stdio:inherit?"inherit":"pipe",timeout:120000,maxBuffer:4*1024*1024});
            if(result.error||result.status!==0)fail("reviewed npm operation failed");return result.stdout;
          }
          async function registryState(record){
            const options={redirect:"error",signal:AbortSignal.timeout(30000)};
            const response=await fetch(registry+encodeURIComponent(record.name)+"/"+record.version,options);
            if(response.status===404){await response.body?.cancel();return "absent";}
            if(response.status!==200)fail("registry availability is unknown");
            async function bounded(response,maximum){
              let size=0;const chunks=[];
              for await(const chunk of response.body){size+=chunk.length;if(size>maximum)fail("registry response exceeded its bound");chunks.push(Buffer.from(chunk));}
              return Buffer.concat(chunks,size);
            }
            const metadata=JSON.parse((await bounded(response,2*1024*1024)).toString("utf8"));
            const url=registry+record.name+"/-/"+record.name.split("/")[1]+"-"+record.version+".tgz";
            if(metadata.name!==record.name||metadata.version!==record.version||
              !equal(metadata.dist?.integrity,record.integrity)||!equal(metadata.dist?.shasum,record.shasum)||metadata.dist?.tarball!==url)
              fail("registry metadata conflicts with original archive");
            const tar=await fetch(url,options);
            if(tar.status===404){await tar.body?.cancel();return "pending";}
            if(tar.status!==200)fail("canonical registry bytes are unavailable");
            const bytes=await bounded(tar,record.size);
            if(bytes.length!==record.size||!equal(digest(bytes),record.sha256)||
              !equal("sha512-"+digest(bytes,"sha512","base64"),record.integrity))fail("canonical registry bytes differ");
            return "present";
          }
          try{
            if(npm(["--version"],configDirectory).trim()!=="11.18.0")fail("reviewed npm version differs");
            const states=[];
            for(const record of manifest.packages)states.push(await registryState(record));
            for(const [index,record] of manifest.packages.entries()){
              const decision=preflight.decisions[index].action,state=states[index];
              if(decision==="skip"&&state!=="present")fail("qualified registry artifact is no longer available");
              if(decision==="publish"&&state!=="absent")fail("registry occupancy changed; rerun unprivileged preflight using the original artifact");
            }
            for(const [index,record] of manifest.packages.entries()){
              if(!record.publish||preflight.decisions[index].action==="skip"){
                process.stdout.write("Verified original registry artifact "+record.name+"@"+record.version+"; skipping.\n");continue;
              }
              const current=await registryState(record);
              if(current!=="absent")fail("registry occupancy changed; fresh authenticated preflight is required");
              const publishDirectory=await mkdtemp(join(process.env.RUNNER_TEMP??tmpdir(),"npm-publish-"));
              try{
                const destination=join(publishDirectory,record.tarball);
                await copyFile(join(releaseDirectory,record.tarball),destination);
                if(!equal(digest(await boundedFile(destination,4*1024*1024)),record.sha256))fail("publish copy changed");
                npm(["publish",destination,"--access","public","--provenance","--ignore-scripts","--registry",registry],publishDirectory,true);
              }finally{await rm(publishDirectory,{recursive:true,force:true});}
              let visible=false;
              for(let attempt=0;attempt<6;attempt++){
                if(await registryState(record)==="present"){visible=true;break;}
                if(attempt<5)await new Promise(resolvePause=>setTimeout(resolvePause,2**attempt*1000));
              }
              if(!visible)fail("published integrity did not become visible; retain original artifact and refresh unprivileged preflight");
            }
          }finally{await rm(configDirectory,{recursive:true,force:true});}
          NODE
          node "${publisher}"

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    env:
      EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
      RELEASE_DIRECTORY: ${{ runner.temp }}/storage-final-input
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Set up Java for DynamoDB Local
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the original prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/storage-final-input
          merge-multiple: true
      - name: Verify registry bytes provenance and consumer
        run: >-
          node scripts/release-registry-verify.mjs verify
          --manifest "${RELEASE_DIRECTORY}/package-manifest.json"
          --expected-release-commit "${RELEASE_COMMIT}"
          --expected-manifest-sha256 "${EXPECTED_MANIFEST_DIGEST}"
          --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --output "${RUNNER_TEMP}/storage-final-proof"
      - name: Retain final registry proof
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: storage-final-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-final-proof/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
